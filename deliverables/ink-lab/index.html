<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>声迹 · 点击墨效选型</title>
<style>
  :root { --paper:#f6efe2; --ink:#1f1b16; --muted:#7a6d5e; --red:#a63a2b; --gold:#b98a4b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 22px 28px 10px; border-bottom: 1px solid rgba(31,27,22,.12); }
  h1 { margin: 0 0 6px; font-family: "Songti SC", "SimSun", serif; font-size: 26px; letter-spacing: .08em; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 28px; }
  .tabs button { border: 1px solid rgba(31,27,22,.2); background: #fbf7ee; color: var(--ink);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff8ec; }
  .stage { position: relative; flex: 1; margin: 0 28px 22px; border: 1px dashed rgba(31,27,22,.25);
    border-radius: 8px; overflow: hidden; background:
      radial-gradient(120% 100% at 20% 10%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%),
      var(--paper); }
  .stage-inner { position: absolute; inset: 0; padding: 40px; }
  .stage h2 { font-family: "Songti SC", "SimSun", serif; font-size: clamp(34px, 5vw, 64px); margin: 0 0 10px; }
  .stage p { max-width: 560px; line-height: 1.9; color: #4f463c; }
  .stage .seal { position: absolute; right: 8%; top: 12%; width: 84px; height: 84px; border-radius: 50%;
    background: var(--red); color: #fff8ec; display: grid; place-items: center; font-family: "Songti SC", serif;
    font-size: 30px; letter-spacing: .1em; }
  .stage small { position: absolute; left: 40px; bottom: 24px; color: var(--muted); letter-spacing: .12em; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; pointer-events: none; }
  .actions { padding: 0 28px 22px; display: flex; gap: 12px; align-items: center; }
  .actions button { border: 0; background: var(--ink); color: #f6efe2; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; cursor: pointer; }
  .actions span { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>点击墨效选型</h1>
  <p>点虚线区域任意位置试效果。默认 A「墨晕扩散」，可在下方切换 B/C/D/E 对比。</p>
</header>
<div class="tabs" role="group" aria-label="墨效方案">
  <button data-variant="A" aria-pressed="true">A · 墨晕扩散（推荐）</button>
  <button data-variant="B" aria-pressed="false">B · 轻墨点</button>
  <button data-variant="C" aria-pressed="false">C · 朱砂印</button>
  <button data-variant="D" aria-pressed="false">D · 水波纹</button>
  <button data-variant="E" aria-pressed="false">E · 无动效</button>
</div>
<div class="stage" id="stage">
  <div class="stage-inner">
    <h2>趁还会唱，<br />把乡音留下来。</h2>
    <p>很多家庭都有一把这样的声音：会唱童谣，会讲旧事，却只响在饭桌上。声迹把它做成可以点、可以听、可以分享的互动故事书。</p>
    <small>点击任意位置，观察落墨</small>
  </div>
  <div class="seal">声</div>
  <canvas id="ink"></canvas>
</div>
<div class="actions">
  <button id="auto">自动演示 5 次</button>
  <span>效果说明：A 柔边墨团 + 洇开外晕 + 少量飞溅；B 只有一枚小墨点；C 朱砂点 + 细涟漪；D 仅水纹；E 关闭。</span>
</div>

<script>
const SPRITES = {
  blots: ["sprites/blot-0.png", "sprites/blot-1.png", "sprites/blot-2.png", "sprites/blot-3.png"],
  drops: ["sprites/drop-0.png", "sprites/drop-1.png"],
  red: "sprites/blot-red.png",
};
const images = {};
Object.values(SPRITES).flat().forEach((src) => {
  const img = new Image();
  img.src = src;
  images[src] = img;
});

const canvas = document.getElementById("ink");
const ctx = canvas.getContext("2d");
let dpr = 1;
let particles = [];
let raf = 0;
let variant = "A";

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const pick = (list) => list[Math.floor(Math.random() * list.length)];
const now = () => performance.now();

function addBlot(x, y, size, alpha, life, sprite) {
  particles.push({ type: "sprite", name: sprite || pick(SPRITES.blots), x, y, size, alpha, life,
    scale: 0.82, rot: Math.random() * Math.PI * 2, vx: 0, vy: 0, born: now() });
}
function addDrop(x, y, size, alpha, life) {
  particles.push({ type: "sprite", name: pick(SPRITES.drops), x, y, size, alpha, life,
    scale: 0.9, rot: Math.random() * Math.PI * 2, vx: 0, vy: 0, born: now() });
}
function addRing(x, y, radius, alpha, life, width, color) {
  particles.push({ type: "ring", x, y, radius, alpha, life, width, color, born: now() });
}

function emit(x, y) {
  if (variant === "E") return;
  if (variant === "B") {
    addBlot(x, y, 34, 0.45, 620);
    addDrop(x + 10, y - 8, 7, 0.35, 380);
    addDrop(x - 12, y + 6, 5, 0.3, 340);
  }
  if (variant === "C") {
    addBlot(x, y, 30, 0.55, 600, SPRITES.red);
    addRing(x, y, 16, 0.55, 700, 1.4, "166,58,43");
    addRing(x, y, 32, 0.3, 920, 1, "166,58,43");
    addDrop(x + 20, y + 10, 7, 0.38, 380);
    addDrop(x - 16, y - 12, 5, 0.3, 340);
  }
  if (variant === "A") {
    addBlot(x, y, 78 + Math.random() * 26, 0.78, 780 + Math.random() * 140);
    addBlot(x, y, 180, 0.12, 1000);
    const count = 5;
    for (let i = 0; i < count; i += 1) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 16 + Math.random() * 28;
      addDrop(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist, 9 + Math.random() * 7, 0.5, 420 + Math.random() * 220);
    }
    if (Math.random() < 0.15) addBlot(x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 40, 20, 0.42, 520, SPRITES.red);
  }
  if (variant === "D") {
    addRing(x, y, 14, 0.5, 620, 1.4, "31,27,22");
    addRing(x, y, 34, 0.32, 860, 1, "31,27,22");
  }
  if (!raf) raf = requestAnimationFrame(frame);
}

function frame(t) {
  const w = canvas.width / dpr;
  const h = canvas.height / dpr;
  ctx.clearRect(0, 0, w, h);
  particles = particles.filter((p) => t - p.born < p.life);
  for (const p of particles) {
    const age = Math.max(0, t - p.born);
    const k = Math.min(1, age / p.life);
    if (p.type === "sprite") {
      const img = images[p.name];
      if (!img || !img.complete) continue;
      const fadeIn = k < 0.12 ? k / 0.12 : 1;
      const alpha = p.alpha * fadeIn * (1 - k) * (1 - k);
      const size = p.size * p.scale * (1 + 0.2 * k);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.drawImage(img, -size / 2, -size / 2, size, size);
      ctx.restore();
    } else {
      const radius = p.radius * (0.4 + k * 1.8);
      ctx.save();
      ctx.globalAlpha = p.alpha * (1 - k) * (1 - k);
      ctx.strokeStyle = "rgba(" + p.color + ",1)";
      ctx.lineWidth = p.width;
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
  if (particles.length) raf = requestAnimationFrame(frame);
  else { raf = 0; ctx.clearRect(0, 0, w, h); }
}

const stage = document.getElementById("stage");
stage.addEventListener("pointerdown", (event) => {
  const rect = stage.getBoundingClientRect();
  emit(event.clientX - rect.left, event.clientY - rect.top);
});

document.querySelectorAll(".tabs button").forEach((button) => {
  button.addEventListener("click", () => {
    variant = button.dataset.variant;
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
  });
});

document.getElementById("auto").addEventListener("click", () => {
  const rect = stage.getBoundingClientRect();
  let i = 0;
  const timer = setInterval(() => {
    const x = 120 + Math.random() * (rect.width - 240);
    const y = 120 + Math.random() * (rect.height - 240);
    emit(x, y);
    i += 1;
    if (i >= 5) clearInterval(timer);
  }, 900);
});
</script>
</body>
</html>
